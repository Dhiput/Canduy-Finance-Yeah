<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canduy Finance</title>
<link rel="apple-touch-icon" href="thumbnail.png">
<link rel="icon" href="thumbnail.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Canduy Finance">
<meta name="theme-color" content="#FF2E90">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Layout: app-shell (header / scroll content / bottom tab bar),
   hash routing (#dashboard #pemasukan #pengeluaran #tracker #setup).
   Theming: base light/dark tokens on :root; per-person brand
   (Dduy = blue, Acaa = pink) layered on top via .app[data-person].
   ============================================================ */
:root{
  --font-display:'Fredoka',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --info:#0E8FA6; --info-soft:#DEF4F7;
  --hemat:#2E6BE6; --aman:#1C9A52; --waspada:#C97A00; --rawan:#DD6B0E; --boros:#D5311F;
  --accent:#FF2E90; --accent-ink:#FFFFFF; --accent-soft:#FFE3F1;
  --bg:#FAF7FA; --surface:#FFFFFF; --surface-2:#F4EEF4; --border:#ECE1EC;
  --ink:#231A2E; --ink-dim:#75697F;
  --shadow-sm:0 1px 2px rgba(20,10,20,.05);
  --shadow-md:0 16px 32px -14px rgba(20,10,20,.22);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --info:#4DD0E1; --info-soft:#113338;
    --hemat:#6C9BFF; --aman:#4ADE80; --waspada:#FBBF24; --rawan:#FB923C; --boros:#F87171;
    --accent:#FF4FA0; --accent-ink:#1A0E16; --accent-soft:#3A1230;
    --bg:#140F1A; --surface:#1E1726; --surface-2:#271D30; --border:#352A3F;
    --ink:#F3EEF7; --ink-dim:#B3A6BF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --info:#4DD0E1; --info-soft:#113338;
  --hemat:#6C9BFF; --aman:#4ADE80; --waspada:#FBBF24; --rawan:#FB923C; --boros:#F87171;
  --accent:#FF4FA0; --accent-ink:#1A0E16; --accent-soft:#3A1230;
  --bg:#140F1A; --surface:#1E1726; --surface-2:#271D30; --border:#352A3F;
  --ink:#F3EEF7; --ink-dim:#B3A6BF;
  color-scheme:dark;
}

/* ---- Person: Acaa (pink, explicit — mirrors base so it's not accidental) ---- */
.app[data-person="acaa"]{
  --accent:#FF2E90; --accent-ink:#FFFFFF; --accent-soft:#FFE3F1;
  --bg:#FAF7FA; --surface:#FFFFFF; --surface-2:#F4EEF4; --border:#ECE1EC; --ink:#231A2E; --ink-dim:#75697F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .app[data-person="acaa"]{
    --accent:#FF4FA0; --accent-ink:#1A0E16; --accent-soft:#3A1230;
    --bg:#140F1A; --surface:#1E1726; --surface-2:#271D30; --border:#352A3F; --ink:#F3EEF7; --ink-dim:#B3A6BF;
  }
}
:root[data-theme="dark"] .app[data-person="acaa"]{
  --accent:#FF4FA0; --accent-ink:#1A0E16; --accent-soft:#3A1230;
  --bg:#140F1A; --surface:#1E1726; --surface-2:#271D30; --border:#352A3F; --ink:#F3EEF7; --ink-dim:#B3A6BF;
}

/* ---- Person: Dduy (dark blue) ---- */
.app[data-person="dduy"]{
  --accent:#1B46C4; --accent-ink:#FFFFFF; --accent-soft:#DCE7FF;
  --bg:#F7F9FC; --surface:#FFFFFF; --surface-2:#EEF2F8; --border:#E1E7F0; --ink:#16213A; --ink-dim:#68748C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .app[data-person="dduy"]{
    --accent:#3D74E6; --accent-ink:#071227; --accent-soft:#16294A;
    --bg:#0B1220; --surface:#121B2E; --surface-2:#19243A; --border:#2A3652; --ink:#EAF0FF; --ink-dim:#93A1C2;
  }
}
:root[data-theme="dark"] .app[data-person="dduy"]{
  --accent:#3D74E6; --accent-ink:#071227; --accent-soft:#16294A;
  --bg:#0B1220; --surface:#121B2E; --surface-2:#19243A; --border:#2A3652; --ink:#EAF0FF; --ink-dim:#93A1C2;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0}
.app{height:100%;display:flex;flex-direction:column;min-width:0;background:var(--bg);color:var(--ink);transition:background .3s ease,color .3s ease}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font-family:inherit}
.tabular{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---- App bar ---- */
.appbar{flex:0 0 auto;background:var(--accent);color:var(--accent-ink);transition:background .3s ease}
.appbar-inner{
  display:flex;align-items:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
}
.appbar .logo{width:36px;height:36px;border-radius:11px;object-fit:cover;flex:0 0 auto;border:2px solid rgba(255,255,255,.5)}
.appbar .brand{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.15;color:#FFFFFF}
.appbar-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:var(--accent-ink);width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;transition:transform .15s ease,background .2s ease}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.3)}
.icon-btn.spinning{animation:spin .8s linear infinite}
.icon-btn.err{box-shadow:0 0 0 2px var(--boros)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.profile-chip{
  background:rgba(255,255,255,.18);color:var(--accent-ink);
  border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 12px 6px 6px;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap;
  transition:transform .15s ease,background .2s ease;
}
.profile-chip:active{transform:scale(.95)}
.avatar{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:0 0 auto}

/* ---- Content ---- */
main.content{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;min-width:0}
.content-inner{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 110px;
  display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto;width:100%;
}
.sticky-fab-rail{
  position:fixed;
  right:calc(16px + env(safe-area-inset-right,0px));
  bottom:calc(72px + env(safe-area-inset-bottom,0px));
  overflow:visible;pointer-events:none;display:flex;justify-content:flex-end;z-index:20;
}

section[data-tab]{display:flex;flex-direction:column;gap:16px;opacity:0;transform:translateY(6px);transition:opacity .26s ease,transform .26s ease}
section[data-tab].in{opacity:1;transform:translateY(0)}
section[data-tab][hidden]{display:none}

/* ---- Cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow-sm);transition:background .3s ease,border-color .3s ease,transform .15s ease}
.hero-card{
  background:linear-gradient(160deg,var(--accent),color-mix(in srgb, var(--accent) 65%, white) 150%);
  color:#FFFFFF;border:none;padding:22px;box-shadow:var(--shadow-md);
}
.hero-card .label{font-size:12px;font-weight:700;letter-spacing:.03em;opacity:.9;text-transform:uppercase}
.hero-card .value{font-family:var(--font-display);font-size:33px;font-weight:800;margin-top:6px}
.hero-card .sub{font-size:12px;opacity:.85;margin-top:8px;line-height:1.5}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px;box-shadow:var(--shadow-sm)}
.stat-tile .label{font-size:11.5px;color:var(--ink-dim);font-weight:600}
.stat-tile .value{font-size:17px;font-weight:700;margin-top:4px;font-family:var(--font-display)}

.section-title{font-size:13px;font-weight:700;color:var(--ink-dim);display:flex;align-items:center;justify-content:space-between}
.hint{font-size:12px;color:var(--ink-dim);line-height:1.55}

/* ---- Category rows ---- */
.kategori-card{display:flex;flex-direction:column;gap:9px}
.kategori-top{display:flex;align-items:center;gap:10px}
.kategori-icon{font-size:19px;width:34px;height:34px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.kategori-name{font-weight:600;font-size:14px;flex:1;min-width:0}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.hemat{background:color-mix(in srgb, var(--hemat) 16%, transparent);color:var(--hemat)}
.badge.aman{background:color-mix(in srgb, var(--aman) 16%, transparent);color:var(--aman)}
.badge.waspada{background:color-mix(in srgb, var(--waspada) 18%, transparent);color:var(--waspada)}
.badge.rawan{background:color-mix(in srgb, var(--rawan) 18%, transparent);color:var(--rawan)}
.badge.boros{background:color-mix(in srgb, var(--boros) 18%, transparent);color:var(--boros)}
.progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1),background .3s ease}
.kategori-nums{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-dim)}
.kategori-nums b{color:var(--ink);font-weight:700}

/* ---- Buttons ---- */
.btn{border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:11px 14px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s ease,background .2s ease}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-outline{background:transparent}
.btn-block{width:100%}
.btn:active{transform:scale(.97)}
.fab{
  pointer-events:auto;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  border:none;font-size:26px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 28px -8px color-mix(in srgb, var(--accent) 55%, transparent);
  margin-right:max(0px,env(safe-area-inset-right,0px));
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .3s ease;
}
.fab:active{transform:scale(.9)}

/* ---- Tab bar ---- */
.tabbar{flex:0 0 auto;background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border)}
.tabbar-inner{
  display:flex;
  padding-left:max(8px,env(safe-area-inset-left,0px));
  padding-right:max(8px,env(safe-area-inset-right,0px));
}
.tab-btn{
  flex:1;background:none;border:none;color:var(--ink-dim);padding:9px 2px 10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;
  transition:color .2s ease;
}
.tab-btn .ic{font-size:18px;display:inline-block;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tab-btn.active{color:var(--accent)}
.tab-btn.active .ic{transform:translateY(-2px) scale(1.08)}

/* ---- List rows ---- */
.entry-row{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);
}
.entry-row.muted{background:var(--surface-2);border-style:dashed;box-shadow:none;opacity:.85}
.entry-main{flex:1;min-width:0}
.entry-date{font-size:11px;color:var(--ink-dim);font-weight:600}
.entry-note{font-size:12.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-amount{font-weight:700;font-size:14.5px;white-space:nowrap;font-family:var(--font-display)}
.entry-amount.neg{color:var(--boros)}
.entry-amount.pos{color:var(--aman)}
.chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--info-soft);color:var(--info);white-space:nowrap}
.chip.nonrutin{background:var(--accent-soft);color:var(--accent)}
.row-del{background:none;border:none;color:var(--ink-dim);font-size:16px;padding:4px;flex:0 0 auto;transition:transform .15s ease}
.row-del:active{transform:scale(.9)}
.confirm-del{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--boros);font-weight:600}
.confirm-del button{font-size:11.5px;padding:5px 9px;border-radius:9px}
@media (max-width:480px){
  .confirm-del{flex:1 1 100%;justify-content:flex-end;padding-top:8px;margin-top:2px;border-top:1px dashed var(--border)}
}

.other-month-block{display:flex;flex-direction:column;gap:10px;padding-top:4px;border-top:1px dashed var(--border);margin-top:2px}
.other-month-block .section-title{color:var(--ink-dim)}

.month-scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.month-scroller::-webkit-scrollbar{display:none}
.month-chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--ink-dim);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .2s ease,color .2s ease,border-color .2s ease}
.month-chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.month-chip.now::after{content:"•";margin-left:4px}

/* ---- Tracker ---- */
.bars{display:flex;gap:10px;align-items:flex-end;justify-content:space-around;padding:10px 4px 0}
.bar-col{flex:1 1 0;min-width:0;max-width:72px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-area{position:relative;width:100%}
.bar-zero{position:absolute;left:0;right:0;height:1px;background:var(--border)}
.bar{position:absolute;left:18%;right:18%;border-radius:6px}
.bar.pos{background:var(--aman)}
.bar.neg{background:var(--boros)}
.bar.run{background:var(--ink-dim);opacity:.7}
.bar-col.now .bar-lbl{color:var(--accent);font-weight:700}
.bar-val{font-size:11px;font-weight:700;font-family:var(--font-display)}
.bar-lbl{font-size:11px;color:var(--ink-dim)}
.tracker-card{display:flex;flex-direction:column;gap:10px}
.tracker-top{display:flex;align-items:center;justify-content:space-between}
.tracker-month{font-weight:700;font-size:14px;font-family:var(--font-display)}
.tracker-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.tracker-grid .k{color:var(--ink-dim)}
.tracker-grid .v{font-weight:700;text-align:right}
.status-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.status-pill.Untung{background:color-mix(in srgb, var(--aman) 16%, transparent);color:var(--aman)}
.status-pill.Rugi{background:color-mix(in srgb, var(--boros) 16%, transparent);color:var(--boros)}
.status-pill.Berjalan{background:var(--info-soft);color:var(--info)}
.status-pill.Impas{background:var(--surface-2);color:var(--ink-dim)}
.status-pill.dash{background:var(--surface-2);color:var(--ink-dim)}

/* ---- Setup: dual-person cards ---- */
.person-card{border:1.5px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);box-shadow:var(--shadow-sm)}
.person-card.theme-dduy{--pc-accent:#1B46C4;--pc-soft:#DCE7FF}
.person-card.theme-acaa{--pc-accent:#FF2E90;--pc-soft:#FFE3F1}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .person-card.theme-dduy{--pc-accent:#3D74E6;--pc-soft:#16294A}
  :root:not([data-theme="light"]) .person-card.theme-acaa{--pc-accent:#FF4FA0;--pc-soft:#3A1230}
}
:root[data-theme="dark"] .person-card.theme-dduy{--pc-accent:#3D74E6;--pc-soft:#16294A}
:root[data-theme="dark"] .person-card.theme-acaa{--pc-accent:#FF4FA0;--pc-soft:#3A1230}
.person-head{display:flex;align-items:center;gap:10px}
.person-avatar{width:40px;height:40px;border-radius:13px;background:var(--pc-soft);color:var(--pc-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-display);font-size:16px;flex:0 0 auto}
.person-name{font-family:var(--font-display);font-weight:700;font-size:15.5px}
.person-tag{font-size:11px;color:var(--ink-dim)}
.person-head .btn{margin-left:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink-dim)}
.field input,.field select{
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:11px;padding:10px 12px;font-size:14px;width:100%;transition:border-color .2s ease;
}
.field input:focus,.field select:focus{outline:2px solid var(--pc-accent, var(--accent));outline-offset:1px}
/* input tanggal: samain lebar & rata kiri di HP (iOS/Android) */
.field input[type="date"]{
  -webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;
  width:100%;min-width:0;max-width:100%;min-height:42px;text-align:left;font-family:inherit;
}
.field input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0;padding:0;min-height:1.2em}
.field input[type="date"]::-webkit-datetime-edit{padding:0}
.field input[type="date"]::-webkit-calendar-picker-indicator{margin:0}
.set-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-dim)}
.set-pill.ok{background:color-mix(in srgb, var(--aman) 16%, transparent);color:var(--aman)}
.kategori-edit-row{display:flex;align-items:center;gap:10px}
.kategori-edit-row input{width:68px;text-align:right}
.percent-total{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.percent-total.ok{color:var(--aman)}
.percent-total.bad{color:var(--boros)}

.seg{display:flex;border:1px solid var(--border);border-radius:12px;padding:3px;position:relative;background:var(--surface-2)}
.seg-highlight{position:absolute;top:3px;bottom:3px;border-radius:9px;background:var(--accent);transition:transform .25s cubic-bezier(.3,.9,.3,1),width .25s cubic-bezier(.3,.9,.3,1)}
.seg button{flex:1;padding:9px;border:none;background:transparent;color:var(--ink-dim);font-size:12.5px;font-weight:700;position:relative;z-index:1;transition:color .2s ease}
.seg button.active{color:var(--accent-ink)}

/* ---- Sheet / modal ---- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(10,6,12,.45);z-index:30;opacity:0;transition:opacity .25s ease}
.sheet-backdrop.open{opacity:1}
.sheet-backdrop[hidden]{display:none}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);
  border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 -20px 40px -16px rgba(0,0,0,.35);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);
}
.sheet.open{transform:translateY(0)}
.sheet[hidden]{display:none}
.sheet-handle{width:36px;height:4px;border-radius:999px;background:var(--border);margin:0 auto}
.sheet-title{font-size:16px;font-weight:700;font-family:var(--font-display)}
.sheet-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--ink-dim)}
.sheet-choice{display:flex;flex-direction:column;gap:10px}
.sheet-choice button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:14px;transition:transform .15s ease}
.sheet-choice button:active{transform:scale(.98)}
.sheet-choice .ic{font-size:20px}
.switch-row{display:flex;align-items:center;gap:12px;width:100%}
.switch-row .check{margin-left:auto;font-size:16px;color:var(--accent);opacity:0}
.switch-row.active .check{opacity:1}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 12px;color:var(--ink-dim)}
.empty .ic{font-size:30px}

<body>
<div class="app" id="appRoot">
  <header class="appbar">
    <div class="appbar-inner">
      <img class="logo" src="thumbnail.png" alt="Canduy Finance" onerror="this.style.display='none'">
      <div class="brand">Canduy Finance</div>
      <div class="appbar-actions">
        <button class="profile-chip" id="profileChip" onclick="openSwitcher()">
          <span class="avatar" id="profileAvatar">D</span>
          <span id="profileChipLabel">Dduy</span>
        </button>
        <button class="icon-btn" id="syncBtn" onclick="refreshNow()" aria-label="Refresh data pasangan" style="display:none">🔄</button>
        <button class="icon-btn" onclick="location.hash='#setup'" aria-label="Setup">⚙️</button>
      </div>
    </div>

  <main class="content">
    <div class="content-inner">

      <section data-tab="dashboard" id="tab-dashboard">
        <div class="card hero-card">
          <div class="label">Saldo Kas Sekarang</div>
          <div class="value tabular" id="dashSaldo">Rp 0</div>

        <div class="stat-row">

            <div class="label">Pemasukan Bulan Ini</div>
            <div class="value tabular" id="dashPemasukan">Rp 0</div>
          </div>
          <div class="stat-tile">
            <div class="label">Terpakai Bulan Ini</div>

        </div>
        <div class="section-title"><span>Alokasi Bulan Ini</span><span id="dashMonthLabel"></span></div>

      <section data-tab="pemasukan" id="tab-pemasukan" hidden>

      <section data-tab="tracker" id="tab-tracker" hidden>
        <div class="card">
          <div class="section-title"><span>Sisa per Bulan</span><span>pemasukan − pengeluaran</span></div>
          <div class="chart-wrap" id="trackerChart"></div>
        </div>
        <div id="trackerList" style="display:flex;flex-direction:column;gap:10px"></div>
      </section>

      <section data-tab="setup" id="tab-setup" hidden>
        <div class="month-scroller" id="setupMonthScroller"></div>
        <div id="peopleCards" style="display:flex;flex-direction:column;gap:14px"></div>
      </section>

    </div>
    <div class="sticky-fab-rail" id="fabRail">
      <button class="fab" id="fabBtn" onclick="handleFab()" aria-label="Tambah">+</button>
    </div>
  </main>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab-btn" data-nav="dashboard" onclick="location.hash='#dashboard'"><span class="ic">🏠</span>Dashboard</button>
      <button class="tab-btn" data-nav="pemasukan" onclick="location.hash='#pemasukan'"><span class="ic">💰</span>Pemasukan</button>
      <button class="tab-btn" data-nav="pengeluaran" onclick="location.hash='#pengeluaran'"><span class="ic">🧾</span>Pengeluaran</button>
      <button class="tab-btn" data-nav="tracker" onclick="location.hash='#tracker'"><span class="ic">📈</span>Tracker</button>
      <button class="tab-btn" data-nav="setup" onclick="location.hash='#setup'"><span class="ic">⚙️</span>Setup</button>
    </div>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
    <div id="sheetBody"></div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------------- Data model ---------------- */
  var KATEGORI = [
    {id:'kewajiban', nama:'Kewajiban Rutin', icon:'🏠'},
    {id:'kebutuhan', nama:'Kebutuhan', icon:'🛒'},
    {id:'keinginan', nama:'Keinginan', icon:'🎉'},
    {id:'tabungan', nama:'Tabungan & Investasi', icon:'📈'},
    {id:'darurat', nama:'Dana Darurat', icon:'🛟'}
  ];
  var PEOPLE_META = {
    dduy:{nama:'Dduy', avatar:'D', tag:'Cowok'},
    acaa:{nama:'Acaa', avatar:'A', tag:'Cewek'}
  };
  var DEFAULT_PERSEN = {kewajiban:25, kebutuhan:25, keinginan:30, tabungan:15, darurat:5};
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var RANGE_START = {y:2026, m:9};  // Okt 2026
  var RANGE_END   = {y:2027, m:11}; // Des 2027

  var STORAGE_KEY = 'canduy-finance-couple-v1';
  var state = null;

  /* ---------------- Sync (Google Apps Script bridge) ----------------
     Isi 2 baris di bawah ini SETELAH deploy Apps Script-nya:
     - SYNC_URL: URL yang muncul pas Deploy > Web app (diakhiri /exec)
     - SYNC_TOKEN: kode rahasia yang SAMA PERSIS kayak di Code.gs (var TOKEN)
     Kalau SYNC_URL dikosongin, app tetap jalan normal pakai localStorage doang
     (gak nyambung, gak ke-share ke pasangan) — jadi ini aman di-deploy kapan aja. */
  var SYNC_URL = 'https://script.google.com/macros/s/AKfycby3TE8muRK-zYu5k63d6-rui58LF8JZptl0DRjLnK6VRumC-c6QU8gB5ORqsWzfmTyZ/exec';
  var SYNC_TOKEN = 'canduysakses987';
  var syncing = false;
  var syncFailed = false;
  var syncRunning = false, syncAgain = false;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function pad2(n){ return (n<10?'0':'')+n; }
  /* tanggal LOKAL (bukan UTC) — biar jam 00:00–06:59 WIB gak mundur sehari */
  function localISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function todayISO(){ return localISO(new Date()); }
  function nowTs(){ return new Date().toISOString(); }
  function ymKey(y,m){ return y+'-'+pad2(m+1); }

  function freshPerson(){
    return {
      saldoAwal: 0,
      tanggalAwal: todayISO(),
      persen: clone(DEFAULT_PERSEN),
      persenBulan: {},      // {'2026-11': {kewajiban,..., ts}} — target % per bulan
      scalarsAt: '',        // kapan saldoAwal/tanggalAwal/persen terakhir diedit (buat rebutan antar HP)
      deleted: {},          // {id: waktuHapus} — biar entri yang dihapus gak "hidup lagi" pas sync
      pemasukan: [],
      pengeluaran: []
    };
  }
  function normPerson(p){
    var n = Object.assign(freshPerson(), p||{});
    n.persen = Object.assign(clone(DEFAULT_PERSEN), n.persen||{});
    n.persenBulan = n.persenBulan || {};
    n.deleted = n.deleted || {};
    n.scalarsAt = n.scalarsAt || '';
    // buang data demo lama (seed*) biar gak nyusup balik ke Sheet
    n.pemasukan = (n.pemasukan||[]).filter(function(e){ return e && e.id && !/^seed/.test(e.id); });
    n.pengeluaran = (n.pengeluaran||[]).filter(function(e){ return e && e.id; });
    return n;
  }

  /* Gabungin 2 versi data 1 orang (a = lokal, b = Sheet). Entri digabung per id, TIDAK ditimpa. */
  function mergePerson(a, b){
    a = normPerson(a); b = normPerson(b);
    var out = {};
    // nilai tunggal: yang paling baru diedit menang; kalau sama-sama belum pernah diedit, ikut Sheet
    var base = (a.scalarsAt > b.scalarsAt) ? a : b;
    out.saldoAwal = base.saldoAwal; out.tanggalAwal = base.tanggalAwal;
    out.persen = base.persen; out.scalarsAt = base.scalarsAt;
    // tombstone: gabung, buang yang udah > 180 hari
    var cutoff = new Date(Date.now()-180*86400000).toISOString();
    out.deleted = {};
    [b.deleted, a.deleted].forEach(function(d){ Object.keys(d).forEach(function(id){ if(d[id] >= cutoff) out.deleted[id] = d[id]; }); });
    ['pemasukan','pengeluaran'].forEach(function(k){
      var map = {};
      b[k].concat(a[k]).forEach(function(e){ map[e.id] = e; });
      out[k] = Object.keys(map).map(function(id){ return map[id]; }).filter(function(e){ return !out.deleted[e.id]; });
    });
    // persen per bulan: per bulan, yang ts-nya lebih baru menang
    out.persenBulan = {};
    var keys = {}; Object.keys(a.persenBulan).concat(Object.keys(b.persenBulan)).forEach(function(k){ keys[k]=1; });
    Object.keys(keys).forEach(function(k){
      var pa = a.persenBulan[k], pb = b.persenBulan[k];
      if(pa && pb) out.persenBulan[k] = ((pa.ts||'') > (pb.ts||'')) ? pa : pb;
      else out.persenBulan[k] = pa || pb;
    });
    return out;
  }
  /* "sidik jari" isi data — buat tau apakah versi gabungan beda dari yang ada di Sheet */
  function sig(p){
    p = normPerson(p);
    var ids = function(arr){ return arr.map(function(e){return e.id;}).sort().join(','); };
    var pb = Object.keys(p.persenBulan).sort().map(function(k){ return k+'@'+(p.persenBulan[k].ts||''); }).join(',');
    return [ids(p.pemasukan), ids(p.pengeluaran), Object.keys(p.deleted).sort().join(','), p.scalarsAt, pb].join('|');
  }

  function updateSyncBtn(){
    var btn = document.getElementById('syncBtn');
    if(!btn) return;
    btn.style.display = SYNC_URL ? 'flex' : 'none';
    btn.classList.toggle('spinning', syncing);
    btn.classList.toggle('err', syncFailed && !syncing);
    btn.title = syncFailed ? 'Sync gagal — data aman di HP ini, dicoba lagi otomatis' : 'Refresh data pasangan';
  }
  function userIsTyping(){
    var a = document.activeElement;
    return !!(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
  }

  /* 1 fungsi sync buat semua: ambil Sheet -> gabung dengan data lokal -> kirim balik kalau ada yang baru */
  function syncAll(cb){
    if(!SYNC_URL){ if(cb) cb(false); return; }
    if(syncRunning){ syncAgain = true; if(cb) cb(false); return; }
    syncRunning = true; syncing = true; updateSyncBtn();
    var finish = function(ok){
      syncRunning = false; syncing = false; syncFailed = !ok; updateSyncBtn();
      if(syncAgain){ syncAgain = false; setTimeout(function(){ syncAll(function(){ if(!userIsTyping()) renderAll(); }); }, 50); }
      if(cb) cb(ok);
    };
    fetch(SYNC_URL+'?token='+encodeURIComponent(SYNC_TOKEN))
      .then(function(r){ return r.json(); })
      .then(function(remote){
        if(!remote || !remote.people) throw new Error('bad remote');
        var toPush = [];
        ['dduy','acaa'].forEach(function(k){
          var rem = remote.people[k] ? normPerson(remote.people[k]) : null;
          var merged = rem ? mergePerson(state.people[k], rem) : normPerson(state.people[k]);
          if(!rem || sig(merged) !== sig(rem)) toPush.push(k);
          state.people[k] = merged;
        });
        saveLocalOnly();
        return Promise.all(toPush.map(function(k){
          return fetch(SYNC_URL, {
            method:'POST', keepalive:true,
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body: JSON.stringify({ token: SYNC_TOKEN, action:'savePerson', person: k, data: state.people[k] })
          }).then(function(r){ return r.json(); }).then(function(j){ if(!j || !j.ok) throw new Error('push gagal'); });
        }));
      })
      .then(function(){ finish(true); }, function(){ finish(false); });
  }
  /* dipanggil tiap habis nambah/hapus/ubah data */
  function syncPush(){ syncAll(function(){ if(!userIsTyping()) renderAll(); }); }
  function syncPull(cb){ syncAll(cb); }

  function defaultState(){
    return { activePerson:'dduy', people:{ dduy: freshPerson(), acaa: freshPerson() } };
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || typeof parsed!=='object' || !parsed.people) return defaultState();
      var d = defaultState();
      d.activePerson = parsed.activePerson==='acaa' ? 'acaa' : 'dduy';
      ['dduy','acaa'].forEach(function(k){ if(parsed.people[k]) d.people[k] = normPerson(parsed.people[k]); });
      return d;
    }catch(e){ return defaultState(); }
  }
  function saveLocalOnly(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
  function saveState(personKey){
    saveLocalOnly();
    syncPush();
  }
  function touchScalars(key){ state.people[key].scalarsAt = nowTs(); }

  /* ---------------- Helpers ---------------- */
  function rupiah(n){
    n = Math.round(n||0);
    var neg = n<0; n = Math.abs(n);
    return (neg?'-':'')+'Rp '+n.toLocaleString('id-ID');
  }
  function parseDate(s){ return new Date(s+'T00:00:00'); }
  function sameMonth(dateStr,y,m){ var d=parseDate(dateStr); return d.getFullYear()===y && d.getMonth()===m; }
  function today(){ return new Date(); }
  function monthRange(){
    var out=[]; var y=RANGE_START.y, m=RANGE_START.m;
    while(y<RANGE_END.y || (y===RANGE_END.y && m<=RANGE_END.m)){ out.push({y:y,m:m}); m++; if(m>11){m=0;y++;} }
    return out;
  }
  function monthLabel(y,m){ return MONTH_NAMES[m]+' '+y; }
  function activeData(){ return state.people[state.activePerson]; }
  function uid(){ return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function pemasukanBulan(y,m,person){
    var d = person ? state.people[person] : activeData();
    return d.pemasukan.filter(function(p){ return p.tipe==='rutin' && sameMonth(p.tanggal,y,m); }).reduce(function(s,p){ return s+p.jumlah; },0);
  }
  function pengeluaranBulan(y,m,kategoriId,person){
    var d = person ? state.people[person] : activeData();
    return d.pengeluaran.filter(function(p){ return sameMonth(p.tanggal,y,m) && (!kategoriId || p.kategoriId===kategoriId); }).reduce(function(s,p){ return s+p.jumlah; },0);
  }
  /* % target yang berlaku di bulan y/m: pakai pengaturan bulan itu; kalau belum diatur,
     ikut pengaturan bulan terdekat SEBELUMNYA; kalau gak ada sama sekali, pakai pengaturan awal.
     Jadi ubah November gak pernah ngubah Oktober. */
  function persenFor(person,y,m){
    var key = ymKey(y,m), bestKey = '', best = null;
    Object.keys(person.persenBulan||{}).forEach(function(k){ if(k<=key && k>bestKey){ bestKey=k; best=person.persenBulan[k]; } });
    if(best) return {p:best, own:bestKey===key, from:bestKey};
    return {p:person.persen, own:false, from:''};
  }
  /* Kas di awal bulan y/m = saldo awal + semua pemasukan - semua pengeluaran SEBELUM tanggal 1 bulan itu. */
  function kasAwalBulan(y,m,person){
    var d = person ? state.people[person] : activeData();
    var first = ymKey(y,m)+'-01';
    var masuk = d.pemasukan.filter(function(p){ return p.tanggal < first; }).reduce(function(s,p){ return s+p.jumlah; },0);
    var keluar = d.pengeluaran.filter(function(p){ return p.tanggal < first; }).reduce(function(s,p){ return s+p.jumlah; },0);
    return d.saldoAwal + masuk - keluar;
  }
  /* Dasar pembagian target bulan itu = kas awal bulan + pemasukan rutin bulan itu (tetap, gak mengecil tiap belanja). */
  function dasarAlokasi(y,m,person){
    return Math.max(0, kasAwalBulan(y,m,person) + pemasukanBulan(y,m,person));
  }
  function alokasiKategori(kategoriId,y,m){
    var persen = persenFor(activeData(),y,m).p[kategoriId] || 0;
    return dasarAlokasi(y,m) * persen/100;
  }
  function saldoKasSekarang(person){
    var d = person ? state.people[person] : activeData();
    var masuk = d.pemasukan.reduce(function(s,p){return s+p.jumlah;},0);
    var keluar = d.pengeluaran.reduce(function(s,p){return s+p.jumlah;},0);
    return d.saldoAwal + masuk - keluar;
  }
  function statusPakai(pct){
    if(pct < 50) return {label:'HEMAT', tone:'hemat'};
    if(pct < 80) return {label:'AMAN', tone:'aman'};
    if(pct < 100) return {label:'WASPADA', tone:'waspada'};
    if(pct <= 115) return {label:'RAWAN', tone:'rawan'};
    return {label:'BOROS', tone:'boros'};
  }

  /* ---------------- Theming ---------------- */
  function applyPersonTheme(){
    document.getElementById('appRoot').setAttribute('data-person', state.activePerson);
    var meta = PEOPLE_META[state.activePerson];
    document.getElementById('profileAvatar').textContent = meta.avatar;
    document.getElementById('profileChipLabel').textContent = meta.nama;
    var themeColor = state.activePerson==='dduy' ? '#1B46C4' : '#FF2E90';
    var tc = document.querySelector('meta[name="theme-color"]');
    if(tc) tc.setAttribute('content', themeColor);
  }

  /* ---------------- Router ---------------- */
  var TABS = ['dashboard','pemasukan','pengeluaran','tracker','setup'];
  var pengeluaranSelectedMonth = RANGE_START;

  function currentTab(){
    var h = location.hash.replace('#','');
    return TABS.indexOf(h)>=0 ? h : 'dashboard';
  }
  function router(){
    var tab = currentTab();
    TABS.forEach(function(t){
      var sec = document.getElementById('tab-'+t);
      sec.hidden = (t!==tab);
      sec.classList.remove('in');
    });
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-nav')===tab);
    });
    document.getElementById('fabRail').style.display = (tab==='setup') ? 'none' : 'flex';
    renderAll();
    requestAnimationFrame(function(){
      var sec = document.getElementById('tab-'+tab);
      requestAnimationFrame(function(){ sec.classList.add('in'); });
    });
  }
  window.addEventListener('hashchange', router);

  /* ---------------- Render: Dashboard ---------------- */
  function renderDashboard(){
    var t = today(), y=t.getFullYear(), m=t.getMonth();
    document.getElementById('dashSaldo').textContent = rupiah(saldoKasSekarang());
    document.getElementById('dashSaldoSub').textContent = 'Saldo awal '+rupiah(activeData().saldoAwal)+' + semua pemasukan − semua pengeluaran';
    var pm = pemasukanBulan(y,m);
    document.getElementById('dashPemasukan').textContent = rupiah(pm);
    document.getElementById('dashTerpakai').textContent = rupiah(pengeluaranBulan(y,m));
    document.getElementById('dashMonthLabel').textContent = monthLabel(y,m);

    var list = document.getElementById('dashKategoriList');
    list.innerHTML = '';
    KATEGORI.forEach(function(k){
      var target = alokasiKategori(k.id,y,m);
      var used = pengeluaranBulan(y,m,k.id);
      var pct = target>0 ? (used/target*100) : 0;
      var st = statusPakai(pct);
      var div = document.createElement('div');
      div.className = 'card kategori-card';
      div.innerHTML =
        '<div class="kategori-top">'+
          '<div class="kategori-icon">'+k.icon+'</div>'+
          '<div class="kategori-name">'+k.nama+'</div>'+
          '<div class="badge '+st.tone+'">'+st.label+'</div>'+
        '</div>'+
        '<div class="progress"><i style="width:'+Math.min(100,pct)+'%;background:var(--'+st.tone+')"></i></div>'+
        '<div class="kategori-nums"><span>Terpakai <b>'+rupiah(used)+'</b></span><span>Target <b>'+rupiah(target)+'</b></span></div>';
      list.appendChild(div);
    });
    document.getElementById('dashHint').textContent = 'Dasar target '+monthLabel(y,m)+': '+rupiah(dasarAlokasi(y,m))+' (kas awal bulan + pemasukan rutin).';
  }

  /* ---------------- Render: Pemasukan ---------------- */
  function entryRowHTML(p, isThisMonth){
    var d = parseDate(p.tanggal);
    return '<div class="entry-row'+(isThisMonth?'':' muted')+'" data-id="'+p.id+'">'+
        '<div class="entry-main">'+
          '<div class="entry-date">'+d.getDate()+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear()+'</div>'+
          '<div class="entry-note">'+(p.catatan||'—')+'</div>'+
        '</div>'+
        '<span class="chip'+(p.tipe==='rutin'?'':' nonrutin')+'">'+(p.tipe==='rutin'?'Rutin':'Non-Rutin')+'</span>'+
        '<div class="entry-amount pos tabular">'+rupiah(p.jumlah)+'</div>'+
        '<button class="row-del" data-del="'+p.id+'">🗑</button>'+
      '</div>';
  }
  function renderPemasukan(){
    var t = today(), y=t.getFullYear(), m=t.getMonth();
    var rows = activeData().pemasukan.slice().sort(function(a,b){ return b.tanggal.localeCompare(a.tanggal); });
    var thisMonth = rows.filter(function(p){ return sameMonth(p.tanggal,y,m); });
    var otherMonth = rows.filter(function(p){ return !sameMonth(p.tanggal,y,m); });

    var listNow = document.getElementById('pemasukanListNow');
    listNow.innerHTML = thisMonth.length
      ? thisMonth.map(function(p){ return entryRowHTML(p,true); }).join('')
      : '<div class="empty"><div class="ic">💰</div><b>Belum ada pemasukan bulan ini</b><span>Tap "+ Catat Pemasukan" buat mulai</span></div>';

    var otherSection = document.getElementById('otherMonthSection');
    otherSection.hidden = otherMonth.length===0;
    document.getElementById('pemasukanListOther').innerHTML = otherMonth.map(function(p){ return entryRowHTML(p,false); }).join('');

  /* ---------------- Render: Pengeluaran ---------------- */

  function renderPengeluaranSummary(){
    var y=pengeluaranSelectedMonth.y, m=pengeluaranSelectedMonth.m;

    wrap.innerHTML = '';

  function renderPengeluaranList(){
    var y=pengeluaranSelectedMonth.y, m=pengeluaranSelectedMonth.m;
    var list = document.getElementById('pengeluaranList');
    var rows = activeData().pengeluaran.filter(function(p){ return sameMonth(p.tanggal,y,m); })
      .sort(function(a,b){ return b.tanggal.localeCompare(a.tanggal); });

      list.innerHTML = '<div class="empty"><div class="ic">🧾</div><b>Belum ada pengeluaran di '+monthLabel(y,m)+'</b><span>Catat transaksi pertama</span></div>';

          '<div class="entry-date">'+d.getDate()+' '+MONTH_NAMES[d.getMonth()]+'</div>'+
          '<div class="entry-note">'+kat.nama+(p.catatan?' · '+p.catatan:'')+'</div>'+

  function renderPengeluaran(){
    renderPengeluaranScroller();
    renderPengeluaranSummary();
    renderPengeluaranList();

  /* ---------------- Render: Tracker ---------------- */
  function buildTracker(){
    var t = today(), nowKey = ymKey(t.getFullYear(), t.getMonth());
    return monthRange().map(function(mm){
      var key = ymKey(mm.y,mm.m);
      var masuk = pemasukanBulan(mm.y,mm.m);
      var keluar = pengeluaranBulan(mm.y,mm.m);
      var sisa = masuk - keluar;
      var dasar = dasarAlokasi(mm.y,mm.m);
      var hasData = (masuk!==0 || keluar!==0);
      var status;
      if(key > nowKey || !hasData) status = '-';                 // belum mulai / kosong
      else if(key === nowKey) status = 'Berjalan';               // bulan ini: belum dinilai
      else status = sisa>0 ? 'Untung' : sisa<0 ? 'Rugi' : 'Impas'; // sudah lewat: baru dinilai
      return {y:mm.y,m:mm.m,key:key,masuk:masuk,keluar:keluar,sisa:sisa,dasar:dasar,hasData:hasData,
              pct: dasar>0 ? (keluar/dasar*100) : 0, status:status, selesai: key<nowKey};
    });
  }
  function fmtJt(n){
    var a = Math.abs(n);
    var t = a>=1000000 ? (a/1000000).toFixed(1).replace('.',',')+'jt' : a>=1000 ? Math.round(a/1000)+'rb' : String(Math.round(a));
    return (n<0?'-':'')+t;
  }
  /* Grafik batang: Sisa (pemasukan - pengeluaran) tiap bulan, berdiri sendiri. Bulan tanpa data gak digambar. */
  function renderTrackerChart(rows){
    var t = today(), cur = ymKey(t.getFullYear(), t.getMonth());
    var shown = rows.filter(function(r){ return r.hasData || r.key===cur; });
    var box = document.getElementById('trackerChart');
    if(!shown.length){ box.innerHTML = '<div class="empty"><span>Belum ada data bulanan</span></div>'; return; }
    var H = 110;
    var maxPos = Math.max.apply(null, shown.map(function(r){ return Math.max(0,r.sisa); }).concat([0]));
    var maxNeg = Math.max.apply(null, shown.map(function(r){ return Math.max(0,-r.sisa); }).concat([0]));
    var tot = (maxPos+maxNeg) || 1;
    var zeroTop = maxPos/tot*H;
    var withVal = shown.length<=8;
    box.innerHTML = '<div class="bars">'+shown.map(function(r){
      var h = Math.max(2, Math.abs(r.sisa)/tot*H);
      var top = r.sisa>=0 ? zeroTop-h : zeroTop;
      if(r.sisa===0){ h=2; top=zeroTop-1; }
      var tone = !r.selesai ? 'run' : (r.sisa>=0 ? 'pos' : 'neg');   // bulan berjalan: abu-abu, belum dinilai
      var isNow = ymKey(r.y,r.m)===cur;
      return '<div class="bar-col'+(isNow?' now':'')+'" title="'+monthLabel(r.y,r.m)+': '+rupiah(r.sisa)+'">'+
        '<div class="bar-area" style="height:'+H+'px">'+
          '<div class="bar-zero" style="top:'+zeroTop.toFixed(1)+'px"></div>'+
          '<div class="bar '+tone+'" style="top:'+top.toFixed(1)+'px;height:'+h.toFixed(1)+'px"></div>'+
        '</div>'+
        (withVal?'<div class="bar-val">'+fmtJt(r.sisa)+'</div>':'')+
        '<div class="bar-lbl">'+MONTH_NAMES[r.m]+'</div>'+
      '</div>';
    }).join('')+'</div>';
  }
  function renderTracker(){
    var rows = buildTracker();
    renderTrackerChart(rows);
    var t = today(), ty=t.getFullYear(), tm=t.getMonth();
    var list = document.getElementById('trackerList');
    list.innerHTML = rows.map(function(r){
      var isNow = r.y===ty && r.m===tm;
      var statusClass = r.status==='-' ? 'dash' : r.status;
      return '<div class="card tracker-card" style="'+(isNow?'border-color:var(--accent)':'')+'">'+
        '<div class="tracker-top"><span class="tracker-month">'+monthLabel(r.y,r.m)+(isNow?' · bulan ini':'')+'</span><span class="status-pill '+statusClass+'">'+r.status+'</span></div>'+
        '<div class="tracker-grid">'+
          '<span class="k">Pemasukan</span><span class="v tabular">'+rupiah(r.masuk)+'</span>'+
          '<span class="k">Terpakai</span><span class="v tabular">'+rupiah(r.keluar)+'</span>'+
          '<span class="k">Sisa bulan ini</span><span class="v tabular">'+rupiah(r.sisa)+'</span>'+
          '<span class="k">% Pakai</span><span class="v tabular">'+r.pct.toFixed(0)+'%</span>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  /* ---------------- Render: Setup (dual person) ---------------- */
  var setupMonth = null;
  function renderSetup(){
    var t = today();
    if(!setupMonth) setupMonth = {y:t.getFullYear(), m:t.getMonth()};
    var inRange = monthRange().some(function(mm){ return mm.y===setupMonth.y && mm.m===setupMonth.m; });
    if(!inRange) setupMonth = monthRange()[0];
    var sm = setupMonth, smLabel = monthLabel(sm.y,sm.m), smKey = ymKey(sm.y,sm.m);

    var sc = document.getElementById('setupMonthScroller');
    sc.innerHTML = '';
    monthRange().forEach(function(mm){
      var chip = document.createElement('button');
      var isNow = mm.y===t.getFullYear() && mm.m===t.getMonth();
      var isActive = mm.y===sm.y && mm.m===sm.m;
      chip.className = 'month-chip'+(isActive?' active':'')+(isNow?' now':'');
      chip.textContent = monthLabel(mm.y,mm.m);
      chip.onclick = function(){ setupMonth = mm; renderSetup(); };
      sc.appendChild(chip);
      if(isActive) setTimeout(function(){ try{ chip.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){} },0);
    });

    var wrap = document.getElementById('peopleCards');
    wrap.innerHTML = '';
    ['dduy','acaa'].forEach(function(key){
      var meta = PEOPLE_META[key];
      var person = state.people[key];
      var pf = persenFor(person, sm.y, sm.m);
      var total = KATEGORI.reduce(function(s,k){ return s+(pf.p[k.id]||0); },0);
      var pill;
      if(pf.own) pill = '<span class="set-pill ok">✓ Sudah diatur</span>';
      else if(pf.from){ var fy=Number(pf.from.slice(0,4)), fm=Number(pf.from.slice(5))-1; pill = '<span class="set-pill">Belum diatur · ikut '+monthLabel(fy,fm)+'</span>'; }
      else pill = '<span class="set-pill">Belum diatur · pengaturan awal</span>';
      var card = document.createElement('div');
      card.className = 'person-card theme-'+key;
      card.innerHTML =
        '<div class="person-head">'+
          '<div class="person-avatar">'+meta.avatar+'</div>'+
          '<div><div class="person-name">'+meta.nama+'</div>'+(state.activePerson===key?'<div class="person-tag">Lagi dilihat</div>':'')+'</div>'+
          '<button class="btn btn-outline" data-view="'+key+'">Lihat</button>'+
        '</div>'+
        '<div class="field"><label>Saldo Awal (Rp)</label><input type="number" min="0" step="1" data-saldo="'+key+'" value="'+person.saldoAwal+'"></div>'+
        '<div class="field"><label>Tanggal dicatat</label><input type="date" data-tanggal="'+key+'" value="'+person.tanggalAwal+'"></div>'+
        '<div style="display:flex;flex-direction:column;gap:8px">'+
          '<div class="section-title"><span>% Target · '+smLabel+'</span><span class="percent-total '+(total===100?'ok':'bad')+'" data-total="'+key+'">Total '+total+'%'+(total===100?' ✓':'')+'</span></div>'+
          '<div>'+pill+'</div>'+
          KATEGORI.map(function(k){
            return '<div class="kategori-edit-row">'+
              '<div class="kategori-icon" style="width:28px;height:28px;font-size:15px">'+k.icon+'</div>'+
              '<div style="flex:1;min-width:0;font-size:13px;font-weight:600">'+k.nama+'</div>'+
              '<input type="number" min="0" max="100" data-person="'+key+'" data-kat="'+k.id+'" value="'+(pf.p[k.id]||0)+'">'+
              '<span style="font-size:12.5px;color:var(--ink-dim)">%</span>'+
            '</div>';
          }).join('')+
        '</div>';
      wrap.appendChild(card);
    });

    wrap.querySelectorAll('[data-view]').forEach(function(btn){
      btn.addEventListener('click', function(){
        switchPerson(btn.getAttribute('data-view'));
      });
    });
    wrap.querySelectorAll('[data-saldo]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var key = inp.getAttribute('data-saldo');
        state.people[key].saldoAwal = Math.max(0, Number(inp.value)||0);
        touchScalars(key);
        saveState(key); renderAll();
      });
    });
    wrap.querySelectorAll('[data-tanggal]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var key = inp.getAttribute('data-tanggal');
        if(!inp.value) return;
        state.people[key].tanggalAwal = inp.value;
        touchScalars(key);
        saveState(key);
      });
    });
    wrap.querySelectorAll('input[data-kat]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var key = inp.getAttribute('data-person');
        var kat = inp.getAttribute('data-kat');
        var val = Math.max(0, Math.min(100, Number(inp.value)||0));
        var person = state.people[key];
        var cur = persenFor(person, sm.y, sm.m).p;
        var obj = {};
        KATEGORI.forEach(function(k){ obj[k.id] = cur[k.id]||0; });
        obj[kat] = val;
        obj.ts = nowTs();
        person.persenBulan[smKey] = obj;   // cuma bulan ini yang berubah
        saveState(key);
        renderSetup();
      });
    });
  }

  /* ---------------- Person switcher ---------------- */
  window.openSwitcher = function(){
    var html = '<div class="sheet-title">Lihat sebagai</div><div class="sheet-choice">';
    ['dduy','acaa'].forEach(function(key){
      var meta = PEOPLE_META[key];
      var active = state.activePerson===key;
      html += '<button class="switch-row'+(active?' active':'')+'" data-switch="'+key+'">'+
        '<span class="ic">'+(key==='dduy'?'🧑':'👩')+'</span><span>'+meta.nama+'</span><span class="check">✓</span>'+
        '</button>';
    });
    html += '</div>';
    openSheet(html);
    document.querySelectorAll('[data-switch]').forEach(function(btn){
      btn.addEventListener('click', function(){
        switchPerson(btn.getAttribute('data-switch'));
        closeSheet();
      });
    });
  };
  function switchPerson(key){
    if(state.activePerson===key) return;
    state.activePerson = key;
    saveLocalOnly();
    applyPersonTheme();
    renderAll();
  }

  /* ---------------- Delete handling ---------------- */
  function wireDelete(container, kind){
    container.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var row = btn.closest('.entry-row');
        var id = btn.getAttribute('data-del');
        if(row.querySelector('.confirm-del')) return;
        var confirmBox = document.createElement('div');
        confirmBox.className = 'confirm-del';
        confirmBox.innerHTML = 'Hapus? <button class="btn" data-yes>Ya</button><button class="btn" data-no>Batal</button>';
        row.appendChild(confirmBox);
        confirmBox.querySelector('[data-yes]').onclick = function(){
          activeData()[kind] = activeData()[kind].filter(function(x){ return x.id!==id; });
          activeData().deleted[id] = nowTs();
          saveState(); renderAll();
        };
        confirmBox.querySelector('[data-no]').onclick = function(){ confirmBox.remove(); };
      });
    });
  }

  /* ---------------- Sheet / forms ---------------- */
  function openSheet(html){
    document.getElementById('sheetBody').innerHTML = html;
    var backdrop = document.getElementById('sheetBackdrop');
    var sheet = document.getElementById('sheet');
    backdrop.hidden = false; sheet.hidden = false;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ backdrop.classList.add('open'); sheet.classList.add('open'); });
    });
  }
  window.closeSheet = function(){
    var backdrop = document.getElementById('sheetBackdrop');
    var sheet = document.getElementById('sheet');
    backdrop.classList.remove('open'); sheet.classList.remove('open');
    setTimeout(function(){ backdrop.hidden = true; sheet.hidden = true; }, 300);
  };

  function wireSeg(container, onChange){
    var seg = container.querySelector('.seg');
    if(!seg) return;
    var highlight = document.createElement('div');
    highlight.className = 'seg-highlight';
    seg.insertBefore(highlight, seg.firstChild);
    var btns = Array.prototype.slice.call(seg.querySelectorAll('button[data-tipe]'));
    function place(btn){
      highlight.style.width = btn.offsetWidth+'px';
      highlight.style.transform = 'translateX('+btn.offsetLeft+'px)';
    }
    btns.forEach(function(b){
      b.addEventListener('click', function(){
        btns.forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        place(b);
        onChange(b.getAttribute('data-tipe'));
      });
    });
    requestAnimationFrame(function(){ place(seg.querySelector('button.active')); });
  }

  window.openForm = function(kind){
    var td = todayISO();
    if(kind==='pemasukan'){
      openSheet(
        '<div class="sheet-title">Catat Pemasukan</div>'+
        '<form id="formPemasukan" style="display:flex;flex-direction:column;gap:12px">'+
          '<div class="field"><label>Tanggal</label><input type="date" id="fpTanggal" value="'+td+'" required></div>'+
          '<div class="field"><label>Jumlah (Rp)</label><input type="number" id="fpJumlah" min="1" step="1" placeholder="0" required></div>'+
          '<div class="field"><label>Catatan / Sumber</label><input type="text" id="fpCatatan" placeholder="mis. gaji, bonus, side income"></div>'+
          '<div class="field"><label>Tipe</label>'+
            '<div class="seg"><button type="button" class="active" data-tipe="rutin">Rutin</button><button type="button" data-tipe="non-rutin">Non-Rutin</button></div>'+
          '</div>'+
          '<button class="btn btn-primary btn-block" type="submit">Simpan</button>'+
        '</form>'
      );
      var tipeVal = 'rutin';
      wireSeg(document.getElementById('sheetBody'), function(v){ tipeVal = v; });
      document.getElementById('formPemasukan').addEventListener('submit', function(ev){
        ev.preventDefault();
        var tgl = document.getElementById('fpTanggal').value;
        var jml = Number(document.getElementById('fpJumlah').value);
        if(!tgl || !jml || jml<=0){ ev.target.reportValidity(); return; }
        activeData().pemasukan.push({id:uid(), tanggal:tgl, jumlah:jml, catatan:document.getElementById('fpCatatan').value.trim(), tipe:tipeVal});
        saveState(); closeSheet(); renderAll();
      });
    } else {
      var katOptions = KATEGORI.map(function(k){ return '<option value="'+k.id+'">'+k.icon+' '+k.nama+'</option>'; }).join('');
      var lastDay = new Date(pengeluaranSelectedMonth.y, pengeluaranSelectedMonth.m+1, 0).getDate();
      var defDate = localISO(new Date(pengeluaranSelectedMonth.y, pengeluaranSelectedMonth.m, Math.min(today().getDate(),lastDay)));
      openSheet(
        '<div class="sheet-title">Catat Pengeluaran</div>'+
        '<form id="formPengeluaran" style="display:flex;flex-direction:column;gap:12px">'+
          '<div class="field"><label>Tanggal</label><input type="date" id="feTanggal" value="'+defDate+'" required></div>'+
          '<div class="field"><label>Jumlah (Rp)</label><input type="number" id="feJumlah" min="1" step="1" placeholder="0" required></div>'+
          '<div class="field"><label>Kategori</label><select id="feKategori">'+katOptions+'</select></div>'+
          '<div class="field"><label>Catatan</label><input type="text" id="feCatatan" placeholder="opsional"></div>'+
          '<button class="btn btn-primary btn-block" type="submit">Simpan</button>'+
        '</form>'
      );
      document.getElementById('formPengeluaran').addEventListener('submit', function(ev){
        ev.preventDefault();
        var tgl = document.getElementById('feTanggal').value;
        var jml = Number(document.getElementById('feJumlah').value);
        if(!tgl || !jml || jml<=0){ ev.target.reportValidity(); return; }
        activeData().pengeluaran.push({id:uid(), tanggal:tgl, jumlah:jml, kategoriId:document.getElementById('feKategori').value, catatan:document.getElementById('feCatatan').value.trim()});
        saveState(); closeSheet(); renderAll();
      });
    }
  };

  window.handleFab = function(){
    var tab = currentTab();
    if(tab==='pemasukan'){ openForm('pemasukan'); return; }
    if(tab==='pengeluaran'){ openForm('pengeluaran'); return; }
    openSheet(
      '<div class="sheet-title">Catat apa?</div>'+
      '<div class="sheet-choice">'+
        '<button onclick="closeSheet();openForm(\'pemasukan\')"><span class="ic">💰</span> Catat Pemasukan</button>'+
        '<button onclick="closeSheet();openForm(\'pengeluaran\')"><span class="ic">🧾</span> Catat Pengeluaran</button>'+
      '</div>'
    );
  };

  /* ---------------- Render all ---------------- */
  function renderAll(){
    var tab = currentTab();
    applyPersonTheme();
    if(tab==='dashboard') renderDashboard();
    else if(tab==='pemasukan') renderPemasukan();
    else if(tab==='pengeluaran') renderPengeluaran();
    else if(tab==='tracker') renderTracker();
    else if(tab==='setup') renderSetup();
  }

  /* ---------------- Boot ---------------- */
  window.refreshNow = function(){
    syncAll(function(){ renderAll(); });
  };
  function start(){
    state = loadState();
    applyPersonTheme();
    if(!location.hash) location.hash = '#dashboard';
    router();
    updateSyncBtn();
    syncAll(function(){ if(!userIsTyping()) renderAll(); });
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='visible') syncAll(function(){ if(!userIsTyping()) renderAll(); });
    });
    window.addEventListener('online', function(){ syncAll(function(){ if(!userIsTyping()) renderAll(); }); });
  }
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {}; });
    window.claude.hot.ready ? window.claude.hot.ready(start) : start();
  } else {
    start();
  }
})();
</script>
